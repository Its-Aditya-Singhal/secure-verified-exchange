# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
yanked = "deny"
ignore = [
    # "Unmaintained", not a vulnerability: a compile-time proc-macro used by
    # gtk-rs 0.18 (glib-macros), which Tauri 2 needs for its Linux webview.
    # Only in svx-desktop's Linux build; revisit when Tauri moves off GTK3.
    { id = "RUSTSEC-2024-0370", reason = "build-time proc-macro via Tauri's GTK3 backend (svx-desktop on Linux only)" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0", "MIT", "BSD-3-Clause", "BSD-2-Clause", "ISC", "Unicode-3.0", "Zlib",
    "CC0-1.0", "Unlicense", "MPL-2.0",
    # target-lexicon (PyO3 build configuration)
    "Apache-2.0 WITH LLVM-exception",
    # webpki-root-certs (Mozilla root store data, via rustls)
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
