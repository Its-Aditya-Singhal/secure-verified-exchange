# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "Apache-2.0", "MIT", "BSD-3-Clause", "BSD-2-Clause", "ISC", "Unicode-3.0", "Zlib",
    "CC0-1.0", "Unlicense", "MPL-2.0",
    # target-lexicon (PyO3 build configuration)
    "Apache-2.0 WITH LLVM-exception",
    # webpki-root-certs (Mozilla root store data, via rustls)
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
