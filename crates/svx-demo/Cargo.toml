[package]
name = "svx-demo"
description = "Scripted Acme Security → Example Corp demo and a one-command local dev stack"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
svx-client = { path = "../svx-client", version = "0.1.0" }
svx-core = { path = "../svx-core", version = "0.1.0" }
svx-mock-idp = { path = "../svx-mock-idp", version = "0.1.0" }
svx-protocol = { path = "../svx-protocol", version = "0.1.0" }
svx-testkit = { path = "../svx-testkit", version = "0.1.0" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
serde_json = "1"
tempfile = "3"
zeroize = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }

[lints]
workspace = true
