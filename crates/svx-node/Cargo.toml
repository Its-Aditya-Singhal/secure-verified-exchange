[package]
name = "svx-node"
description = "Node.js bindings for the SVX client (built with @napi-rs/cli; see sdk/node)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
# Tests live in sdk/node/test (node:test).
test = false
doctest = false

[dependencies]
svx-client = { path = "../svx-client", version = "0.1.0" }
svx-core = { path = "../svx-core", version = "0.1.0" }
svx-protocol = { path = "../svx-protocol", version = "0.1.0" }
napi = { version = "3", default-features = false, features = ["napi6", "dyn-symbols", "tokio_rt"] }
napi-derive = "3"
serde = "1"
serde_json = "1"

[build-dependencies]
napi-build = "2"

# Not `lints.workspace`: napi's macros expand to unsafe FFI glue, which the
# workspace-wide `forbid(unsafe_code)` would reject. Code written in this
# crate contains no `unsafe` (checked in CI).
[lints.clippy]
all = { level = "warn", priority = -1 }
