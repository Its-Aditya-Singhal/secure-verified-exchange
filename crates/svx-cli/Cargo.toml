[package]
name = "svx-cli"
description = "The svx command-line tool"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "svx"
path = "src/main.rs"

[dependencies]
svx-client = { path = "../svx-client", version = "0.1.0", features = ["keychain"] }
svx-core = { path = "../svx-core", version = "0.1.0" }
svx-oidc = { path = "../svx-oidc", version = "0.1.0" }
svx-protocol = { path = "../svx-protocol", version = "0.1.0" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
humantime = "2"
# Recovery password prompts without echo.
rpassword = "7"
serde_json = "1"
tempfile = "3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serde_json = "1"
svx-testkit = { path = "../svx-testkit", version = "0.1.0" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
