[package]
name = "svx-app"
description = "Command layer of the SVX desktop app: serializable operations over svx-client, no UI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
svx-client = { path = "../svx-client", version = "0.1.0" }
svx-protocol = { path = "../svx-protocol", version = "0.1.0" }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
svx-core = { path = "../svx-core", version = "0.1.0" }
svx-testkit = { path = "../svx-testkit", version = "0.1.0" }
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
