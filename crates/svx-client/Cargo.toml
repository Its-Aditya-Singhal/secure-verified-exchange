[package]
name = "svx-client"
description = "SVX client library: configuration, OIDC login, fail-closed open, managed pack, administration"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
svx-core = { path = "../svx-core", version = "0.1.0" }
svx-oidc = { path = "../svx-oidc", version = "0.1.0" }
svx-protocol = { path = "../svx-protocol", version = "0.1.0" }
async-trait = "0.1"
base64 = "0.22"
directories = "6"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["net", "io-util", "time", "rt", "macros"] }
toml = "1"
url = "2"
webbrowser = "1"
zeroize = "1"
# OS keychain for signing keys (macOS Keychain, Windows Credential Manager,
# Linux Secret Service over pure-Rust D-Bus). Enabled by the desktop app.
keyring = { version = "4", optional = true }
# Folders: deflate only, no other codecs or encryption.
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[features]
keychain = ["dep:keyring"]
presence = ["dep:robius-authentication", "dep:windows"]

# Touch ID before sensitive key use (desktop app). On Windows, robius asks for
# the account password, which PIN-only and passwordless accounts can't give,
# so Windows uses Windows Hello directly (face, fingerprint or PIN).
[target.'cfg(target_os = "macos")'.dependencies]
robius-authentication = { version = "0.3", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = ["Security_Credentials_UI"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
svx-mock-idp = { path = "../svx-mock-idp", version = "0.1.0" }
svx-oidc = { path = "../svx-oidc", version = "0.1.0" }
tokio = { version = "1", features = ["full"] }
url = "2"

[lints]
workspace = true
