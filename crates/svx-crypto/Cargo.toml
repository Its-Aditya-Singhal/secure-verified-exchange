[package]
name = "svx-crypto"
description = "SVX-1 cryptographic profile: STREAM chunk AEAD, HPKE key envelopes, key schedule and Ed25519 signing"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
svx-format = { path = "../svx-format", version = "0.1.0" }
chacha20poly1305 = "0.11"
ed25519-dalek = { version = "3", features = ["rand_core", "zeroize"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
hkdf = "0.13"
hpke = { version = "0.14.1", default-features = false, features = ["x25519", "mlkem", "alloc", "chacha", "hkdfsha2"] }
ml-dsa = { version = "0.1.1", default-features = false, features = ["alloc", "rand_core", "zeroize"] }
rand_core = "0.10"
sha2 = "0.11"
subtle = "2.6"
thiserror = "2"
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
chacha20 = { version = "0.10", features = ["rng"] }
hex = "0.4"
serde_json = "1"

[lints]
workspace = true
