[package]
name = "svx-crypto"
description = "SVX-1 cryptographic profile: STREAM chunk AEAD, HPKE key envelopes, key schedule and Ed25519 signing"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
svx-format = { path = "../svx-format", version = "0.1.0" }
# Password-protected key backups and account password hashes (Argon2id).
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = "0.11"
ed25519-dalek = { version = "3", features = ["rand_core", "zeroize"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
hex = "0.4"
hkdf = "0.13"
hpke = { version = "0.14.1", default-features = false, features = ["x25519", "mlkem", "nistp", "alloc", "chacha", "hkdfsha2"] }
ml-dsa = { version = "0.1.1", default-features = false, features = ["alloc", "rand_core", "zeroize"] }
rand_core = "0.10"
# SLH-DSA (FIPS 205) for suite SVX-2. Pinned: a release candidate, used only
# as a third signature that must also verify (see threat model T25).
slh-dsa = { version = "=0.2.0-rc.5", features = ["zeroize"] }
sha2 = "0.11"
subtle = "2.6"
thiserror = "2"
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
# The MLKEM1024-P384 HPKE vector uses AES-256-GCM; only the tests need it.
hpke = { version = "0.14.1", default-features = false, features = ["aes", "nistp", "mlkem", "hkdfsha2", "alloc"] }
chacha20 = { version = "0.10", features = ["rng"] }
serde_json = "1"

[lints]
workspace = true
