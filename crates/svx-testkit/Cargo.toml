[package]
name = "svx-testkit"
description = "Test harness: real Postgres, dev IdPs, managed service and key agent on loopback"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
svx-client = { path = "../svx-client", version = "0.1.0" }
svx-core = { path = "../svx-core", version = "0.1.0" }
svx-keyagent = { path = "../svx-keyagent", version = "0.1.0" }
svx-mock-idp = { path = "../svx-mock-idp", version = "0.1.0" }
svx-oidc = { path = "../svx-oidc", version = "0.1.0" }
svx-protocol = { path = "../svx-protocol", version = "0.1.0" }
svx-server = { path = "../svx-server", version = "0.1.0" }
axum = "0.8"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1", features = ["full"] }
url = "2"

[dev-dependencies]
tempfile = "3"
zeroize = "1"

[lints]
workspace = true
