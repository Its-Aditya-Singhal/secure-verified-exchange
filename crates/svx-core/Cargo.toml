[package]
name = "svx-core"
description = "High-level SVX pack, verify and open operations"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
svx-format = { path = "../svx-format", version = "0.1.0" }
svx-crypto = { path = "../svx-crypto", version = "0.1.0" }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = "1.8"

[dev-dependencies]
chacha20 = { version = "0.10", features = ["rng"] }
rand_core = "0.10"
tempfile = "3"

[lints]
workspace = true
