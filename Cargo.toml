[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/its-aditya-singhal/secure-verified-exchange"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Key backups use Argon2id with 64 MiB; keep tests quick in debug builds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
# SVX-2 signatures and KEM: unoptimized SLH-DSA takes about a minute per signature.
# Its generic code is instantiated in svx-crypto, so that is optimized too.
[profile.dev.package.svx-crypto]
opt-level = 3
[profile.dev.package.slh-dsa]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.sha3]
opt-level = 3
[profile.dev.package.keccak]
opt-level = 3
[profile.dev.package.ml-dsa]
opt-level = 3
[profile.dev.package.ml-kem]
opt-level = 3
[profile.dev.package.p384]
opt-level = 3

[profile.release]
overflow-checks = true
