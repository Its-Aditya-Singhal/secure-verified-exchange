name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  managed-mode-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: svx
          POSTGRES_PASSWORD: svx
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U svx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SVX_TEST_DATABASE_URL: postgres://svx:svx@127.0.0.1:5432/postgres
      SVX_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p svx-server -p svx-keyagent -p svx-oidc -p svx-protocol

  large-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p svx-core --release -- --ignored

  vectors-reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run -p svx-testvectors -- test-vectors/v1
      - run: git diff --exit-code test-vectors/

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - name: Run each target for 60s, seeded from the test vectors
        working-directory: fuzz
        run: |
          for t in parse verify_open manifest; do
            mkdir -p corpus/$t
            cp ../test-vectors/v1/*.svx corpus/$t/ || true
            cargo +nightly fuzz run $t corpus/$t -- -max_total_time=60 -rss_limit_mb=1024
          done

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
