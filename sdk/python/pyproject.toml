[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "svx"
description = "SVX secure verified exchange: open, pack and administer .svx artifacts"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Security :: Cryptography",
]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.maturin]
manifest-path = "../../crates/svx-py/Cargo.toml"
module-name = "svx._native"
python-source = "."
python-packages = ["svx"]
features = ["pyo3/extension-module"]
include = ["svx/py.typed", "svx/_native.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
