[package]
name = "svx-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
svx-client = { path = "../crates/svx-client" }
svx-core = { path = "../crates/svx-core" }
svx-protocol = { path = "../crates/svx-protocol" }
svx-testvectors = { path = "../crates/svx-testvectors" }
svx-viewer = { path = "../crates/svx-viewer" }
tempfile = "3"

# Not part of the main workspace: requires nightly + cargo-fuzz.
[workspace]

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

