[package]
name = "svx-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
svx-core = { path = "../crates/svx-core" }
svx-testvectors = { path = "../crates/svx-testvectors" }

# Not part of the main workspace: requires nightly + cargo-fuzz.
[workspace]

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "verify_open"
path = "fuzz_targets/verify_open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest"
path = "fuzz_targets/manifest.rs"
test = false
doc = false
bench = false
